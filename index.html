<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>skypills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("skypills-lang");
        var lang = saved === "ru" || saved === "en"
          ? saved
          : ((navigator.language || "").toLowerCase().indexOf("ru") === 0 ? "ru" : "en");
        document.documentElement.lang = lang;
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="aurora__blob aurora__blob--1"></span>
    <span class="aurora__blob aurora__blob--2"></span>
    <span class="aurora__blob aurora__blob--3"></span>
  </div>
  <div class="noise" aria-hidden="true"></div>
  <canvas id="field" aria-hidden="true"></canvas>

  <main class="stage">
    <article class="card" id="card">
      <div class="card__glow" aria-hidden="true"></div>

      <header class="profile">
        <div class="avatar" aria-hidden="true">
          <span>S</span>
        </div>
        <div class="profile__text">
          <p class="eyebrow" data-i18n="eyebrow">привет, я</p>
          <h1 class="name">skypills</h1>
          <p class="role" data-i18n="role">Front-end Developer</p>
        </div>
      </header>

      <section class="skills" aria-label="Навыки" data-i18n-aria="skillsAria">
        <h2 class="skills__title" data-i18n="skillsTitle">Мои скилы</h2>
        <ul class="skills__list">
          <li class="chip" style="--brand:#e34f26; --brand-2:#f7df1e;">
            <span class="chip__icon">&lt;/&gt;</span>
            <span class="chip__label">HTML / CSS</span>
          </li>
          <li class="chip" style="--brand:#f7df1e; --brand-2:#f7df1e;">
            <span class="chip__icon">JS</span>
            <span class="chip__label">JavaScript</span>
          </li>
          <li class="chip" style="--brand:#8b5cf6; --brand-2:#22d3ee;">
            <span class="chip__icon">C#</span>
            <span class="chip__label">C# / .NET</span>
          </li>
          <li class="chip" style="--brand:#10b981; --brand-2:#34d399;">
            <span class="chip__icon">dj</span>
            <span class="chip__label">Django</span>
          </li>
          <li class="chip" style="--brand:#fbbf24; --brand-2:#f59e0b;">
            <span class="chip__icon">$_</span>
            <span class="chip__label">Linux</span>
          </li>
          <li class="chip" style="--brand:#38bdf8; --brand-2:#2563eb;">
            <span class="chip__icon">tg</span>
            <span class="chip__label">Telegram API</span>
          </li>
        </ul>
      </section>

      <a class="github" href="https://github.com/skypills" target="_blank" rel="noopener noreferrer">
        <span class="github__shine" aria-hidden="true"></span>
        <svg class="github__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/>
        </svg>
        <span class="github__text">
          <strong data-i18n="github">Мой GitHub</strong>
          <small>github.com/skypills</small>
        </span>
        <svg class="github__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M8 7h9v9"/>
        </svg>
      </a>

      <footer class="footer">
        <span class="status"><span class="status__dot"></span><span data-i18n="status">открыт к проектам</span></span>
        <div class="lang" role="group" aria-label="Language">
          <button class="lang__btn is-active" type="button" data-lang="ru" aria-pressed="true" title="Русский">RU</button>
          <button class="lang__btn" type="button" data-lang="en" aria-pressed="false" title="English">EN</button>
        </div>
      </footer>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
